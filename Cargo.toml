[package]
name = "AetherTune"
version = "0.11.1"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
radiobrowser = "0.4"
tokio = { version = "1", features = ["full"] }
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wasapi = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# Bindings to Apple's CoreAudio/CoreFoundation frameworks (already present
# on every Mac — nothing for the user to install), used for real-time
# system audio capture via a Core Audio process tap. See
# src/audio/coreaudio_capture.rs for details.
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"